name: Build & Release

# Builds the Apple Silicon (arm64) and Intel (x86_64) apps on a macOS runner and attaches
# both zips to a GitHub release.
# - Publish a release on GitHub (or with `gh release create`) → built for that release's tag
# - Push a tag like v1.2 → built, release created if it doesn't exist yet
# - Run manually (Actions → Build & Release → Run workflow) → optional tag input; without a
#   tag the zips are only kept as workflow artifacts

on:
  release:
    types: [published]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the zips to (optional)"
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build arm64 and x86_64 apps
        run: ./Scripts/build_app.sh release all

      - name: Verify architectures
        run: |
          lipo -archs build/arm64/SlowFlowX.app/Contents/MacOS/SlowFlowX
          lipo -archs build/x86_64/SlowFlowX.app/Contents/MacOS/SlowFlowX
          ls -la build/*.zip

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SlowFlowX-apps
          path: build/*.zip

      - name: Attach to GitHub release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/*.zip --clobber
          else
            gh release create "$TAG" build/*.zip --title "SlowFlowX ${TAG#v}" --generate-notes
          fi
